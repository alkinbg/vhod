name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:10.11
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: vhod_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=12

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, mbstring, pdo_mysql, pdo_sqlite
                  coverage: none
                  tools: composer:v2

            - name: Validate Composer metadata
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Validate container
              run: php bin/console lint:container

            - name: Validate Doctrine mapping
              run: php bin/console doctrine:schema:validate --skip-sync --env=test

            - name: Verify MariaDB migrations
              env:
                  DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/vhod_test?serverVersion=10.11.0-MariaDB&charset=utf8mb4'
              run: |
                  php bin/console doctrine:migrations:migrate --no-interaction --env=test
                  php bin/console doctrine:schema:validate --env=test || { php bin/console doctrine:schema:update --dump-sql --env=test || true; exit 1; }
                  php bin/console doctrine:migrations:migrate prev --no-interaction --env=test
                  php bin/console doctrine:migrations:migrate --no-interaction --env=test
                  php bin/console doctrine:schema:validate --env=test || { php bin/console doctrine:schema:update --dump-sql --env=test || true; exit 1; }

            - name: PHPUnit
              run: vendor/bin/phpunit

            - name: PHPStan
              run: vendor/bin/phpstan analyse --no-progress
