name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, mbstring, pdo_sqlite
                  coverage: none
                  tools: composer:v2

            - name: Validate Composer metadata
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --no-interaction --prefer-dist --no-progress

            - name: Validate container
              run: php bin/console lint:container

            - name: Validate Doctrine mapping
              run: php bin/console doctrine:schema:validate --skip-sync --env=test

            - name: PHPUnit
              run: vendor/bin/phpunit

            - name: PHPStan
              run: vendor/bin/phpstan analyse --no-progress

            - name: Commit dependency lock
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  cp composer.lock /tmp/composer.lock
                  git fetch origin "$HEAD_REF"
                  git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
                  cp /tmp/composer.lock composer.lock

                  if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add composer.lock
                  git commit -m "build: lock dependencies"
                  git push origin "HEAD:$HEAD_REF"
