name: Phase 9 Composer Lock

on:
  push:
    branches:
      - feat/phase9-general-assembly
    paths:
      - composer.json
      - .github/workflows/phase9-composer-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, dom, iconv, mbstring
          coverage: none
          tools: composer:v2

      - name: Refresh Composer lock metadata
        run: |
          composer update --lock --no-install --no-interaction --no-scripts --no-progress
          composer validate --strict

      - name: Commit generated lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "build: refresh Composer lock for BCMath"
          git push origin "HEAD:${GITHUB_REF_NAME}"
