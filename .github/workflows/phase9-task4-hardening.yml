name: Phase 9 Task 4 Hardening

on:
  push:
    branches:
      - feat/phase9-general-assembly
    paths:
      - .github/workflows/phase9-task4-hardening.yml

permissions:
  contents: write

jobs:
  harden-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Doctrine metadata and migration indexes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/Entity/GeneralAssembly.php': [
                  (
                      "#[ORM\\Index(name: 'idx_general_assembly_closed_by', columns: ['closed_by_id'])]\nclass GeneralAssembly",
                      "#[ORM\\Index(name: 'idx_general_assembly_closed_by', columns: ['closed_by_id'])]\n#[ORM\\Index(name: 'idx_general_assembly_status_scheduled', columns: ['status', 'scheduled_at'])]\nclass GeneralAssembly",
                  ),
              ],
              'src/Entity/AssemblyAgendaItem.php': [
                  (
                      "#[ORM\\Table(name: 'assembly_agenda_item')]\n#[ORM\\Index(name: 'idx_assembly_agenda_item_assembly', columns: ['assembly_id'])]",
                      "#[ORM\\Table(name: 'assembly_agenda_item')]\n#[ORM\\UniqueConstraint(name: 'uniq_assembly_agenda_position', columns: ['assembly_id', 'position'])]\n#[ORM\\Index(name: 'idx_assembly_agenda_item_assembly', columns: ['assembly_id'])]",
                  ),
              ],
              'src/Entity/AssemblyElectorateEntry.php': [
                  (
                      "#[ORM\\Index(name: 'idx_electorate_person', columns: ['person_id'])]\nclass AssemblyElectorateEntry",
                      "#[ORM\\Index(name: 'idx_electorate_person', columns: ['person_id'])]\n#[ORM\\Index(name: 'idx_electorate_assembly_unit', columns: ['assembly_id', 'unit_id'])]\n#[ORM\\Index(name: 'idx_electorate_assembly_person', columns: ['assembly_id', 'person_id'])]\nclass AssemblyElectorateEntry",
                  ),
              ],
              'src/Entity/AssemblyQuorumCheck.php': [
                  (
                      "#[ORM\\Index(name: 'idx_quorum_checked_by', columns: ['checked_by_id'])]\nclass AssemblyQuorumCheck",
                      "#[ORM\\Index(name: 'idx_quorum_checked_by', columns: ['checked_by_id'])]\n#[ORM\\Index(name: 'idx_quorum_assembly_checked', columns: ['assembly_id', 'checked_at'])]\nclass AssemblyQuorumCheck",
                  ),
              ],
              'migrations/Version20260909150000.php': [
                  (
                      "INDEX idx_general_assembly_closed_by (closed_by_id), PRIMARY KEY (id)",
                      "INDEX idx_general_assembly_closed_by (closed_by_id), INDEX idx_general_assembly_status_scheduled (status, scheduled_at), PRIMARY KEY (id)",
                  ),
                  (
                      "INDEX idx_assembly_agenda_item_assembly (assembly_id), PRIMARY KEY (id)",
                      "UNIQUE INDEX uniq_assembly_agenda_position (assembly_id, position), INDEX idx_assembly_agenda_item_assembly (assembly_id), PRIMARY KEY (id)",
                  ),
                  (
                      "INDEX idx_electorate_person (person_id), PRIMARY KEY (id)",
                      "INDEX idx_electorate_person (person_id), INDEX idx_electorate_assembly_unit (assembly_id, unit_id), INDEX idx_electorate_assembly_person (assembly_id, person_id), PRIMARY KEY (id)",
                  ),
                  (
                      "INDEX idx_quorum_checked_by (checked_by_id), PRIMARY KEY (id)",
                      "INDEX idx_quorum_checked_by (checked_by_id), INDEX idx_quorum_assembly_checked (assembly_id, checked_at), PRIMARY KEY (id)",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one occurrence, found {count}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          rm .github/workflows/phase9-task4-hardening.yml

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Entity migrations/Version20260909150000.php .github/workflows/phase9-task4-hardening.yml
          git commit -m "test: harden General Assembly schema integrity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
