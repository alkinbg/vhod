name: Phase 9 Task 5 Domain

on:
  push:
    branches: [feat/phase9-general-assembly]
    paths: ['.github/workflows/phase9-task5-domain.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase9-general-assembly
          fetch-depth: 0
      - name: Apply invitation mapping and migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/Entity/GeneralAssembly.php')
          s = p.read_text()
          s = s.replace(
              "use App\\Enum\\AssemblyDecisionKind;\nuse App\\Enum\\GeneralAssemblyStatus;",
              "use App\\Enum\\AssemblyDecisionKind;\nuse App\\Enum\\DocumentAccessLevel;\nuse App\\Enum\\DocumentCategory;\nuse App\\Enum\\GeneralAssemblyStatus;\nuse App\\Repository\\GeneralAssemblyRepository;"
          )
          s = s.replace("#[ORM\\Entity]\n#[ORM\\Table(name: 'general_assembly')]", "#[ORM\\Entity(repositoryClass: GeneralAssemblyRepository::class)]\n#[ORM\\Table(name: 'general_assembly')]")
          s = s.replace(
              "#[ORM\\Index(name: 'idx_general_assembly_status_scheduled', columns: ['status', 'scheduled_at'])]",
              "#[ORM\\Index(name: 'idx_general_assembly_status_scheduled', columns: ['status', 'scheduled_at'])]\n#[ORM\\Index(name: 'idx_general_assembly_invitation_document', columns: ['invitation_document_id'])]"
          )
          marker = "    #[ORM\\Column(type: 'datetime_immutable', nullable: true)]\n    private ?DateTimeImmutable $closedAt = null;\n"
          insert = marker + "\n    #[ORM\\ManyToOne]\n    #[ORM\\JoinColumn(name: 'invitation_document_id', nullable: true, onDelete: 'RESTRICT', foreignKeyName: 'fk_general_assembly_invitation_document')]\n    private ?Document $invitationDocument = null;\n"
          if marker not in s:
              raise SystemExit('GeneralAssembly closedAt marker not found')
          s = s.replace(marker, insert, 1)
          marker2 = "    public function getClosedAt(): ?DateTimeImmutable { return $this->closedAt; }\n"
          insert2 = marker2 + "\n    public function linkInvitation(Document $document): void\n    {\n        $this->assertStatus(GeneralAssemblyStatus::DRAFT, 'Invitation may be linked only while the General Assembly is a draft.');\n        if (null !== $this->invitationDocument) {\n            throw new DomainException('General Assembly invitation is immutable once linked.');\n        }\n        if (DocumentCategory::MEETING_INVITATION !== $document->getCategory() || DocumentAccessLevel::RESIDENTS !== $document->getAccessLevel()) {\n            throw new InvalidArgumentException('General Assembly invitation must be a resident-visible MEETING_INVITATION document.');\n        }\n\n        $this->invitationDocument = $document;\n    }\n\n    public function getInvitationDocument(): ?Document { return $this->invitationDocument; }\n"
          if marker2 not in s:
              raise SystemExit('GeneralAssembly getter marker not found')
          s = s.replace(marker2, insert2, 1)
          p.write_text(s)

          p = Path('migrations/Version20260909150000.php')
          s = p.read_text()
          s = s.replace(
              "closed_by_id INT DEFAULT NULL, status VARCHAR(32)",
              "closed_by_id INT DEFAULT NULL, invitation_document_id INT DEFAULT NULL, status VARCHAR(32)"
          )
          s = s.replace(
              "INDEX idx_general_assembly_status_scheduled (status, scheduled_at), PRIMARY KEY",
              "INDEX idx_general_assembly_status_scheduled (status, scheduled_at), INDEX idx_general_assembly_invitation_document (invitation_document_id), PRIMARY KEY"
          )
          quorum = "        $this->addSql(\"CREATE TABLE assembly_quorum_check"
          pos = s.find(quorum)
          if pos < 0:
              raise SystemExit('quorum table marker not found')
          end = s.find("\n", pos)
          posting = "\n        $this->addSql(\"CREATE TABLE assembly_invitation_posting (id INT AUTO_INCREMENT NOT NULL, assembly_id INT NOT NULL, confirmed_by_id INT NOT NULL, evidence_document_id INT DEFAULT NULL, posted_at DATETIME NOT NULL, posting_place VARCHAR(255) NOT NULL, notes LONGTEXT DEFAULT NULL, INDEX idx_invitation_posting_assembly (assembly_id), INDEX idx_invitation_posting_confirmed_by (confirmed_by_id), INDEX idx_invitation_posting_evidence_document (evidence_document_id), PRIMARY KEY (id)) DEFAULT CHARACTER SET utf8mb4 COLLATE `utf8mb4_unicode_ci` ENGINE = InnoDB\");"
          s = s[:end] + posting + s[end:]
          fk_marker = "        $this->addSql('ALTER TABLE general_assembly ADD CONSTRAINT fk_general_assembly_closed_by FOREIGN KEY (closed_by_id) REFERENCES app_user (id) ON DELETE RESTRICT');"
          s = s.replace(fk_marker, fk_marker + "\n        $this->addSql('ALTER TABLE general_assembly ADD CONSTRAINT fk_general_assembly_invitation_document FOREIGN KEY (invitation_document_id) REFERENCES document (id) ON DELETE RESTRICT');")
          qfk = "        $this->addSql('ALTER TABLE assembly_quorum_check ADD CONSTRAINT fk_quorum_checked_by FOREIGN KEY (checked_by_id) REFERENCES app_user (id) ON DELETE RESTRICT');"
          s = s.replace(qfk, qfk + "\n        $this->addSql('ALTER TABLE assembly_invitation_posting ADD CONSTRAINT fk_invitation_posting_assembly FOREIGN KEY (assembly_id) REFERENCES general_assembly (id) ON DELETE RESTRICT');\n        $this->addSql('ALTER TABLE assembly_invitation_posting ADD CONSTRAINT fk_invitation_posting_confirmed_by FOREIGN KEY (confirmed_by_id) REFERENCES app_user (id) ON DELETE RESTRICT');\n        $this->addSql('ALTER TABLE assembly_invitation_posting ADD CONSTRAINT fk_invitation_posting_evidence_document FOREIGN KEY (evidence_document_id) REFERENCES document (id) ON DELETE RESTRICT');")
          down = "    public function down(Schema $schema): void\n    {\n"
          replacement = down + "        $this->addSql('ALTER TABLE assembly_invitation_posting DROP FOREIGN KEY fk_invitation_posting_assembly');\n        $this->addSql('ALTER TABLE assembly_invitation_posting DROP FOREIGN KEY fk_invitation_posting_confirmed_by');\n        $this->addSql('ALTER TABLE assembly_invitation_posting DROP FOREIGN KEY fk_invitation_posting_evidence_document');\n        $this->addSql('ALTER TABLE general_assembly DROP FOREIGN KEY fk_general_assembly_invitation_document');\n"
          if down not in s:
              raise SystemExit('down marker not found')
          s = s.replace(down, replacement, 1)
          drop_marker = "        $this->addSql('DROP TABLE assembly_quorum_check');"
          s = s.replace(drop_marker, "        $this->addSql('DROP TABLE assembly_invitation_posting');\n" + drop_marker, 1)
          p.write_text(s)
          PY
          php -l src/Entity/GeneralAssembly.php
          php -l migrations/Version20260909150000.php
          rm .github/workflows/phase9-task5-domain.yml
      - name: Commit domain mapping
        run: |
          git config user.name "Alkin Fehim"
          git config user.email "alkinbg@gmail.com"
          git add src/Entity/GeneralAssembly.php migrations/Version20260909150000.php .github/workflows/phase9-task5-domain.yml
          git commit -m "feat: link General Assembly invitation evidence"
          git push origin HEAD:feat/phase9-general-assembly
